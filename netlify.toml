[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single page application: every route is served by index.html and resolved by React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Built assets have a content hash in their name, so they can be cached forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
